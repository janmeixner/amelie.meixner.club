<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Für Amelie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
  /* Layout: Übersicht mit zwei Countdowns und zwei Kacheln; Quiz und Stimmung öffnen als Karte */
  :root {
    --bg: #fbf1ee; --card: #fffaf8; --fg: #3a1f24; --muted: #8a6a6f;
    --accent: #b8325a; --accent-soft: #f6d9e0; --line: #ecd6d6;
    --display: "Young Serif", Georgia, serif;
    --on-bg: var(--fg); --on-bg-muted: var(--muted);
    --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1d1216; --card: #2a1a20; --fg: #f6e8eb; --muted: #c4a3ab;
    --accent: #ff7aa0; --accent-soft: #4a2531; --line: #3d2830; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #1d1216; --card: #2a1a20; --fg: #f6e8eb; --muted: #c4a3ab;
    --accent: #ff7aa0; --accent-soft: #4a2531; --line: #3d2830; color-scheme: dark }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body);
    padding-block: 28px; padding-inline: 16px; font-size: 16px; }
  main { width: 100%; max-width: 32rem; margin: 0 auto; }
  #home { display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 32px 24px; box-shadow: 0 12px 40px -24px rgba(120,30,60,.35); }
  .hearts { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .hearts span { font-size: 15px; color: var(--line); transition: color .3s, transform .3s; }
  .hearts span.on { color: var(--accent); transform: scale(1.15); }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    text-align: center; margin: 0 0 8px; font-weight: 700; }
  h1, h2 { font-family: var(--display); font-weight: 400; text-align: center; text-wrap: balance; margin: 0 0 24px; }
  h1 { font-size: clamp(1.9rem, 7vw, 2.5rem); line-height: 1.15; }
  h2 { font-size: clamp(1.4rem, 5vw, 1.75rem); line-height: 1.25; }
  p.lead { text-align: center; color: var(--muted); line-height: 1.6; margin: -8px 0 28px; }
  .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .opt { font: inherit; text-align: center; padding: 14px 10px; border-radius: 16px; cursor: pointer;
    border: 1.5px solid var(--line); background: transparent; color: var(--fg); line-height: 1.3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 0;
    transition: border-color .2s, background .2s, transform .15s; }
  .pic { font-size: 34px; line-height: 1; transition: transform .2s; }
  .flag { width: 46px; height: 31px; display: block; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); }
  .opt.picked .pic { transform: scale(1.12); }
  .field { display: grid; gap: 8px; margin-top: 18px; color: var(--muted); font-size: 14px; }
  .field textarea { font: inherit; font-size: 16px; color: var(--fg); background: transparent; resize: vertical;
    border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; }
  .field textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
  .opt:hover { border-color: var(--accent); }
  .opt:active { transform: scale(.98); }
  .opt.picked { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
  .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 24px; }
  .btn { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 24px; cursor: pointer;
    background: var(--accent); color: var(--card); }
  .btn:disabled { opacity: .4; cursor: default; }
  .link { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px 0; }
  .center { display: flex; justify-content: center; margin-top: 8px; }
  .big { font-size: 48px; text-align: center; margin-bottom: 12px; color: var(--accent); }
  .note { font-size: 13px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.5; }
  /* Übersicht */
  .hello { text-align: center; margin-bottom: 4px; }
  .hello h1 { margin-bottom: 8px; }
  .count { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px;
    box-shadow: 0 12px 40px -24px rgba(120,30,60,.35); display: grid; gap: 16px; }
  .count-head { display: flex; align-items: center; gap: 14px; }
  .count-head h2 { text-align: left; margin: 0; font-size: 1.35rem; }
  .count-icon { font-size: 34px; line-height: 1; flex: none; }
  .sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
  .digits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .unit { background: var(--accent-soft); border-radius: 14px; padding: 10px 4px; display: grid; justify-items: center; gap: 2px; }
  .num { font-family: var(--display); font-size: clamp(1.6rem, 7vw, 2.1rem); color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .done { grid-column: 1 / -1; text-align: center; font-family: var(--display); font-size: 1.4rem; color: var(--accent); margin: 0; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 22px 12px; cursor: pointer; display: grid; justify-items: center; gap: 6px; text-align: center; min-width: 0;
    box-shadow: 0 12px 40px -24px rgba(120,30,60,.35); transition: border-color .2s, transform .15s; }
  .tile strong { font-family: var(--display); font-weight: 400; font-size: 1.2rem; hyphens: auto; }
  .tile .pic { font-size: 40px; }
  .tile:hover { border-color: var(--accent); }
  .tile:active { transform: scale(.98); }
  .tile:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .moods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .moods .opt { padding: 12px 4px; font-size: 13px; }
  .card > .link:first-child { margin: -12px 0 8px; }
  .together { display: inline-block; margin: 0; background: var(--accent-soft); color: var(--accent); border-radius: 999px;
    padding: 8px 16px; font-weight: 700; font-size: 14px; line-height: 1.4; }
  .together span { font-weight: 600; opacity: .8; }
  .tile.wide { grid-column: 1 / -1; grid-template-columns: auto 1fr; justify-items: start; text-align: left; column-gap: 16px; row-gap: 2px; padding: 18px 20px; }
  .tile.wide .pic { grid-row: span 2; align-self: center; }
  .section-label { display: block; font-weight: 700; margin: 22px 0 10px; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line);
    background: transparent; color: var(--fg); cursor: pointer; }
  .chip.picked { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
  .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .input, .field input { font: inherit; font-size: 16px; color: var(--fg); background: transparent; width: 100%;
    border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .input:focus-visible, .field input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
  .quip { text-align: center; color: var(--muted); font-style: italic; margin: 0 0 10px; line-height: 1.5; }
  .err { color: var(--accent); text-align: center; font-weight: 700; margin: 14px 0 0; }
  /* Jahreszeiten-Modi */
  #fx-back, #fx-front { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fx-back { z-index: 0; } #fx-front { z-index: 60; }
  main { position: relative; z-index: 1; }
  .hello h1 { color: var(--on-bg); } .hello .eyebrow { color: var(--on-bg-muted); }
  body[data-season="xmas"] { --on-bg: #fdf6ec; --on-bg-muted: #cfe3d2; --accent: #c62832; --accent-soft: #fbe1df;
    background: radial-gradient(circle at 15% 8%, #3f7f58 0, transparent 38%), radial-gradient(circle at 90% 35%, #6f1d27 0, transparent 34%),
      linear-gradient(180deg, #1f4a33, #11301f); background-attachment: fixed; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-season="xmas"] { --accent: #ff7a7a; --accent-soft: #4b2226; } }
  :root[data-theme="dark"] body[data-season="xmas"] { --accent: #ff7a7a; --accent-soft: #4b2226; }
  body[data-season="nye"] { --bg: #0b0d26; --card: #171a3d; --fg: #f3f0ff; --muted: #b9b4dc; --accent: #ffc94d; --accent-soft: #34305c;
    --line: #2d3060; --on-bg: #ffffff; --on-bg-muted: #c9c4ee; color-scheme: dark;
    background: radial-gradient(ellipse at 50% 120%, #2b2a6b 0, transparent 60%), linear-gradient(180deg, #05061a, #12153a); background-attachment: fixed; }
  body[data-season="fasching"] { --on-bg: #2b1a3a; --on-bg-muted: #6b4f80; --accent: #7b2ff7; --accent-soft: #efe4ff;
    background: radial-gradient(circle at 12% 14%, #ffd23f66 0 70px, transparent 71px), radial-gradient(circle at 88% 26%, #3bceac55 0 90px, transparent 91px),
      radial-gradient(circle at 70% 88%, #ee426655 0 100px, transparent 101px), linear-gradient(160deg, #fff4d6, #ffe1ec 50%, #e0f0ff); background-attachment: fixed; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-season="fasching"] { --on-bg: #fff; --on-bg-muted: #d8c8f0;
    --accent: #c89bff; --accent-soft: #3a2556; background: linear-gradient(160deg, #2a1340, #13233d); background-attachment: fixed; } }
  :root[data-theme="dark"] body[data-season="fasching"] { --on-bg: #fff; --on-bg-muted: #d8c8f0; --accent: #c89bff; --accent-soft: #3a2556;
    background: linear-gradient(160deg, #2a1340, #13233d); background-attachment: fixed; }
  body[data-season="vday"] { --on-bg: #fff; --on-bg-muted: #ffe0e8; --accent: #d81b4f; --accent-soft: #ffe0e8;
    background: radial-gradient(circle at 20% 10%, #ff9ab3 0, transparent 45%), linear-gradient(160deg, #ff6b8f, #b5174f); background-attachment: fixed; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-season="vday"] { --accent: #ff7aa0; --accent-soft: #4a1f2c; } }
  :root[data-theme="dark"] body[data-season="vday"] { --accent: #ff7aa0; --accent-soft: #4a1f2c; }
  body[data-season="halloween"] { --bg: #1a1024; --card: #261733; --fg: #f6ecff; --muted: #c2aed6; --accent: #ff8c1a; --accent-soft: #3d2547;
    --line: #3a2650; --on-bg: #fff; --on-bg-muted: #e0c9ff; color-scheme: dark;
    background: radial-gradient(circle at 82% 10%, #fff3c4 0 32px, #fff3c433 34px, transparent 90px), linear-gradient(180deg, #120a1c, #2a1238); background-attachment: fixed; }
  body[data-season=""][data-snow="1"] { --on-bg: #fff; --on-bg-muted: #dbe8f7;
    background: radial-gradient(circle at 20% 0%, #9cc0e6 0, transparent 50%), linear-gradient(180deg, #5f86b2, #2f4d73); background-attachment: fixed; }
  body[data-snow="1"] .count, body[data-snow="1"] .tile { position: relative; }
  .frost { position: absolute; left: 12px; right: 12px; top: -11px; height: 0; pointer-events: none; z-index: 2; }
  .frost .cap { position: absolute; left: -4px; top: 0; filter: drop-shadow(0 2px 2px rgba(40,70,110,.18)); }
  .frost .icicles { position: absolute; left: 0; top: 17px; }
  .ice { transform-box: fill-box; transform-origin: 50% 0; animation: grow 3.5s cubic-bezier(.2,.7,.3,1) var(--d) both; }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  body[data-snow="1"]::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 60px; z-index: 0; pointer-events: none;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 60' preserveAspectRatio='none'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffffff'/><stop offset='1' stop-color='%23d8e6f4'/></linearGradient></defs><path d='M0 34 C40 18 70 30 110 24 S180 8 230 22 S320 36 360 20 S400 26 400 26 V60 H0Z' fill='url(%23g)'/><path d='M0 46 C60 34 120 44 190 38 S300 30 400 42 V60 H0Z' fill='%23eef4fb'/></svg>") bottom / 100% 100% no-repeat; }
  #decor { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; color: var(--on-bg); }
  .dec { position: absolute; line-height: 1; opacity: .9; }
  .hang { position: absolute; top: 0; transform-origin: 20px 0; }
  .sway { animation: sway 5s ease-in-out var(--d) infinite alternate; }
  .float { animation: float 6s ease-in-out var(--d) infinite alternate; }
  .twinkle { animation: twinkle 2.4s ease-in-out var(--d) infinite alternate; }
  .glow { filter: drop-shadow(0 0 10px #ff9a3c); }
  .star { color: #fff; }
  .ground { position: absolute; left: 0; bottom: 0; width: 100%; height: 140px; }
  .web { position: absolute; left: 0; top: 0; width: 130px; height: 130px; }
  .streamer { position: absolute; width: 120px; height: 60px; opacity: .85; }
  @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  @keyframes float { from { transform: translateY(-6px) rotate(-4deg); } to { transform: translateY(6px) rotate(4deg); } }
  @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sway, .float, .twinkle, .ice { animation: none; } }
  .wx-home { margin: 8px 0 0; color: var(--on-bg-muted); font-size: 14px; min-height: 1em; }
  .garland { width: 100%; height: 34px; display: block; margin-top: -16px; }
  .bulb { animation: blink 1.4s ease-in-out infinite alternate; } .bulb:nth-of-type(odd) { animation-delay: .7s; }
  @keyframes blink { from { opacity: 1; } to { opacity: .35; } }
  .ribbon { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0; color: var(--on-bg);
    font-family: var(--display); font-size: 1.2rem; }
  .ribbon .e { font-size: 28px; } .cane { width: 18px; height: 36px; flex: none; }
  .corner { display: none; }
  @media (min-width: 960px) { body[data-season="xmas"] .corner { display: block; position: fixed; bottom: 24px; font-size: 72px; z-index: 1; pointer-events: none; }
    .c1 { left: 32px; } .c2 { right: 32px; } }
  .weather { display: flex; align-items: center; gap: 12px; margin: 0; padding-top: 14px; border-top: 1px dashed var(--line);
    color: var(--muted); font-size: 14px; line-height: 1.4; }
  .weather .w-ico { font-size: 28px; } .weather strong { color: var(--fg); font-size: 17px; }
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(20, 8, 12, .55); display: grid; place-items: center; padding-inline: 16px; }
  .modal-card { background: var(--card); color: var(--fg); border-radius: 24px; padding: 32px 24px; max-width: 24rem; width: 100%;
    text-align: center; box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
  .modal-card .big { font-size: 64px; } .modal-card .lead { margin: 0 0 20px; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  .sim { margin-top: 24px; padding: 18px 20px; } .sim .section-label { margin-top: 0; }
  @media (prefers-reduced-motion: reduce) { .bulb, .modal-card { animation: none; } }
  .fade { animation: fade .35s ease both; }
  @keyframes fade { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } .opt, .hearts span { transition: none; } }
</style>
</head>
<body>

<div id="decor" aria-hidden="true"></div>
<canvas id="fx-back" aria-hidden="true"></canvas>
<main>
  <div id="home"></div>
  <div class="card" id="card" hidden></div>
  <div class="card sim" id="sim" hidden></div>
</main>
<div class="modal" id="modal" hidden></div>
<canvas id="fx-front" aria-hidden="true"></canvas>
<div class="corner c1" aria-hidden="true">🎅</div><div class="corner c2" aria-hidden="true">🎄</div>

<script>
  // Mail-Versand über Web3Forms. Den Schlüssel bekommst du kostenlos auf web3forms.com.
  const ACCESS_KEY = "90dcfece-f54e-4203-861b-e7a430412afc";

  // Flaggen als eingebaute Bilder, weil Flaggen-Emojis z. B. unter Windows nur als Buchstaben erscheinen.
  const star = (cx, cy, r, rot = 0) => Array.from({ length: 10 }, (_, i) => {
    const a = rot + Math.PI * i / 5 - Math.PI / 2, d = i % 2 ? r * .38 : r;
    return `${(cx + d * Math.cos(a)).toFixed(2)},${(cy + d * Math.sin(a)).toFixed(2)}`; }).join(" ");
  const flag = (w, h, body) => `<svg class="flag" viewBox="0 0 ${w} ${h}" role="img">${body}</svg>`;
  const bars = (dir, cols) => cols.map((c, i) => dir === "v"
    ? `<rect x="${i}" width="1" height="2" fill="${c}"/>` : `<rect y="${i}" width="3" height="1" fill="${c}"/>`).join("");
  const FLAGS = {
    it: flag(3, 2, bars("v", ["#009246", "#fff", "#ce2b37"])),
    fr: flag(3, 2, bars("v", ["#0055a4", "#fff", "#ef4135"])),
    de: flag(5, 3, `<rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#dd0000"/><rect y="2" width="5" height="1" fill="#ffce00"/>`),
    mx: flag(3, 2, bars("v", ["#006847", "#fff", "#ce1126"]) + `<circle cx="1.5" cy="1" r=".28" fill="#8c5a2b"/>`),
    gr: flag(27, 18, Array.from({ length: 9 }, (_, i) => `<rect y="${i * 2}" width="27" height="2" fill="${i % 2 ? "#fff" : "#0d5eaf"}"/>`).join("") +
      `<rect width="10" height="10" fill="#0d5eaf"/><rect x="4" width="2" height="10" fill="#fff"/><rect y="4" width="10" height="2" fill="#fff"/>`),
    us: flag(19, 10, Array.from({ length: 13 }, (_, i) => `<rect y="${(i * 10 / 13).toFixed(3)}" width="19" height="${(10 / 13 + .01).toFixed(3)}" fill="${i % 2 ? "#fff" : "#b22234"}"/>`).join("") +
      `<rect width="7.6" height="5.385" fill="#3c3b6e"/>` +
      Array.from({ length: 12 }, (_, i) => `<circle cx="${(1 + (i % 4) * 1.85 + (Math.floor(i / 4) % 2) * .9).toFixed(2)}" cy="${(1 + Math.floor(i / 4) * 1.7).toFixed(2)}" r=".3" fill="#fff"/>`).join("")),
    jp: flag(3, 2, `<rect width="3" height="2" fill="#fff"/><circle cx="1.5" cy="1" r=".6" fill="#bc002d"/>`),
    cn: flag(30, 20, `<rect width="30" height="20" fill="#de2910"/><polygon points="${star(5, 5, 3)}" fill="#ffde00"/>` +
      [[10, 2], [12, 4], [12, 7], [10, 9]].map(([x, y]) => `<polygon points="${star(x, y, 1)}" fill="#ffde00"/>`).join(""))
  };

  // Die Gerichte, aus denen am Ende die Favoriten ermittelt werden: [Name, Bild]
  const DISHES = {
    pizza: ["Pizza", "🍕"], pasta: ["Pasta", "🍝"], sushi: ["Sushi", "🍣"], burger: ["Veggie-Burger", "🍔"],
    wok: ["Wok-Nudeln", "🥡"], griech: ["Griechisch", "🫒"], mex: ["Mexikanisch", "🌮"],
    fisch: ["Fisch (z. B. Lachs)", "🐟"], bowl: ["Bowl oder Salat", "🥗"], flamm: ["Flammkuchen", "🫓"],
    spaetzle: ["Käsespätzle", "🥘"], doener: ["Veggie-Döner", "🥙"], broetchen: ["Belegte Brötchen vom Bäcker", "🥪"],
    kartoffel: ["Ofenkartoffel", "🥔"], suppe: ["Suppe", "🍲"], risotto: ["Risotto", "🍚"], quiche: ["Quiche", "🥧"],
    omelett: ["Omelett oder Rührei", "🍳"], wrap: ["Wraps", "🌯"], gnocchi: ["Gnocchi", "🥟"]
  };

  // Antworten: [Text, Bild, Punkte für Gerichte]. multi: mehrere Antworten möglich.
  // kind "dessert": zählt nicht für die Gerichte, mit optionalem eigenen Wunsch. kind "text": nur Freitext.
  const QUESTIONS = [
    { q: "Worauf hast du gerade am meisten Lust?", a: [
      ["Etwas Deftiges", "🥨", { burger: 2, pizza: 1, flamm: 1, mex: 1, spaetzle: 2, doener: 2, kartoffel: 2, gnocchi: 1 }],

    confetti = confetti.filter(c => {
      c.y += c.vy; c.x += c.vx; c.r += c.vr; c.vy += .03;
      fctx.save(); fctx.translate(c.x, c.y); fctx.rotate(c.r); fctx.fillStyle = c.c;
      if (c.heart) { fctx.font = "18px sans-serif"; fctx.fillText("♥", -6, 6); } else fctx.fillRect(-4, -2.5, 8, 5);
      fctx.restore(); return c.y < H + 20;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function burst(hearts) {
    if (reduce) return;
    for (let i = 0; i < 140; i++) confetti.push({ x: rnd(0, W), y: rnd(-H * .6, -10), vx: rnd(-1, 1), vy: rnd(1.5, 3.5), r: rnd(0, 6), vr: rnd(-.1, .1),
      c: hearts ? ["#e0466b", "#ff8fab", "#b8325a", "#ffc2d1"][i % 4] : FW_COLORS[i % 6], heart: hearts && i % 2 === 0 });
  }

  // ---------- Pop-ups: Geburtstag, Jahrestag, Monatstag, Neujahr ----------
  function popupFor(n = now()) {
    const m = n.getMonth(), d = n.getDate(), y = n.getFullYear();
    if (m === 8 && d === 12) return { key: "bday", icon: "🎂", title: "Alles Liebe zum Geburtstag, kleiner Spatz!",
      text: "Ich wünsche dir den schönsten Tag. Lass dich heute so richtig feiern. Ich hab dich lieb! ♥", fx: "confetti" };
    if (m === 11 && d === 6) return { key: "niko", icon: "🎅", title: "Ho ho ho, Amelie!",
      text: "Warst du dieses Jahr auch schön brav? Oder muss ich Knecht Ruprecht vorbeischicken? 😏 Ich hoffe, deine Stiefel sind geputzt!" };
    if (m === 1 && d === 14) return { key: "vday", icon: "💘", title: "Happy Valentinstag!",
      text: "Für die Liebste der Welt: Ich hab dich unendlich lieb. ♥", fx: "hearts" };
    if (m === 0 && d === 1) return { key: "ny", icon: "🎆", title: `Frohes neues Jahr ${y}!`,
      text: `Auf ein wunderschönes ${y} mit dir. Ich freu mich auf alles, was wir zusammen erleben.` };
    if (d === 24 && n > TOGETHER) {
      const months = (y - TOGETHER.getFullYear()) * 12 + m - TOGETHER.getMonth();
      if (m === 7) { const yrs = months / 12;
        return { key: "jt", icon: "🥂", title: "Happy Jahrestag!", text: `Heute sind wir schon ${yrs === 1 ? "1 Jahr" : yrs + " Jahre"} zusammen. Danke für jeden einzelnen Tag mit dir. ♥`, fx: "hearts" }; }
      const y2 = Math.floor(months / 12), m2 = months % 12;
      const extra = y2 ? ` (${y2 === 1 ? "1 Jahr" : y2 + " Jahre"}${m2 ? ` und ${m2 === 1 ? "1 Monat" : m2 + " Monate"}` : ""})` : "";
      return { key: "mt", icon: "💕", title: "Happy Monatstag!", text: `Heute sind wir schon ${months} Monate zusammen${extra}. Schön, dass es dich gibt.`, fx: "hearts" };
    }
    return null;
  }
  function checkPopup() {
    const p = popupFor(); if (!p) return;
    const seenKey = `popup-${p.key}-${ymd(now())}`;
    if (!simName || simName === "Heute") { if (store.get(seenKey)) return; store.set(seenKey, "1"); }
    const modal = document.getElementById("modal");
    modal.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="big" aria-hidden="true">${p.icon}</div><h2 id="modal-title">${p.title}</h2><p class="lead">${p.text}</p>
      <div class="center"><button class="btn" id="modal-ok">Danke ♥</button></div></div>`;
    modal.hidden = false; document.getElementById("modal-ok").focus();
    document.getElementById("modal-ok").onclick = () => modal.hidden = true;
    if (p.fx) burst(p.fx === "hearts");
  }

  function applySeason() { document.body.dataset.season = season(); document.body.dataset.snow = snowing() ? "1" : ""; refreshDecor(); }

  // Wechselnde Sprüche unter „Hallo Amelie“
  const GREETINGS = [
    "Wie geht es dir heute?", "Kann ich dir heute helfen?", "Schön, dass du da bist", "Was steht heute bei dir an?",
    "Hast du schon was gegessen?", "Ich hab dich lieb", "Ich denk gerade an dich", "Hast du gut geschlafen?",
    "Worauf hast du heute Lust?", "Du schaffst das heute", "Schon an Schottland gedacht?", "Lust auf ein Date?",
    "Gönn dir heute was Schönes", "Du bist die Beste", "Lächeln steht dir übrigens super"
  ];
  // Sprüche zu besonderen Tagen und Zeiten (ersetzen dann die normalen Sprüche)
  const THEMED = {
    bday: ["Happy Birthday, kleiner Spatz! 🎂", "Alles Gute zum Geburtstag! 🥳", "Heute ist dein Tag! 🎉", "Happy Birthday to you! 🎈"],
    jt: ["Happy Jahrestag! 🥂", "Heute ist unser Tag ♥", "Auf uns! 🥂"],
    niko: ["Ho ho ho! Warst du brav? 🎅", "Schon die Stiefel geputzt? 🥾", "Der Nikolaus war da! 🍫"],
    xmasEve: ["Frohe Weihnachten! 🎄", "Schöne Bescherung! 🎁", "Frohes Fest, mein Schatz ✨", "Stille Nacht, kuschelige Nacht 🕯️"],
    xmas: ["Frohe Adventszeit! 🕯️", "Schon Plätzchen genascht? 🍪", "Lust auf ein Glühwein-Date? 🍷", "Hast du schon einen Wunschzettel? 📜",
           "Kerzen an, Kuscheldecke raus 🕯️", "Du stehst ganz oben auf meiner Wunschliste 🎁", "Bald ist Weihnachten! 🎄", "Ho ho ho! 🎅"],
    nye: ["Guten Rutsch ins neue Jahr! 🥂", "Bereit fürs Feuerwerk? 🎆", "Auf ein neues Jahr mit dir! ✨"],
    ny: ["Frohes neues Jahr! 🎆", "Prost Neujahr! 🥂", "Neues Jahr, neue Abenteuer mit dir ✨"],
    fasching: ["Helau! 🎭", "Schon verkleidet? 🤡", "Konfetti-Alarm! 🎉", "Kamelle! 🍬", "Alle Narren aufgepasst! 🥳",
               "Ich bin ein Pirat, und du? 🏴‍☠️", "Heut' wird geschunkelt! 🎶", "Helau und Alaaf, Hauptsache Party! 🎊"],
    vday: ["Happy Valentinstag! 💘", "Du bist mein Lieblingsmensch ♥", "Für immer dein Valentin 💌"],
    easter: ["Frohe Ostern! 🐣", "Schon Eier gesucht? 🥚", "Der Osterhase war da! 🐰"],
    halloween: ["Buuuh! 👻", "Süßes oder Saures? 🍬", "Heute Nacht ist Geisterstunde 🕯️", "Hast du dich schon gegruselt? 🕷️",
                "Achtung, hinter dir! … nur Spaß 😈", "Happy Halloween! 🎃"],
    snow: ["Es schneit! ❄️", "Zeit für eine Schneeballschlacht? ⛄", "Heißer Kakao gefällig? ☕", "Draußen schneit's, drinnen kuscheln 🧣"]
  };
  let greeting = pick(GREETINGS);   // ein Spruch pro Besuch
  function occasion(n = now()) {
    const m = n.getMonth(), d = n.getDate(), s = season(n), e = easter(n.getFullYear());
    if (m === 8 && d === 12) return "bday";
    if (m === 7 && d === 24) return "jt";
    if (m === 11 && d === 6) return "niko";
    if (m === 11 && d >= 24 && d <= 26) return "xmasEve";
    if (s === "nye") return m === 0 ? "ny" : "nye";
    if (s === "xmas" || s === "fasching" || s === "vday" || s === "halloween") return s;
    if (n >= e && n < addDays(e, 2)) return "easter";
    if (snowing()) return "snow";
    return "";
  }
  function pickGreeting() { const o = occasion(); return pick(o ? THEMED[o] : GREETINGS); }

  // ---------- Übersicht ----------
  function renderHome() {
    const last = store.get("lastMood"), tg = togetherText(), s = season(), n = now();
    const ribbon = s === "xmas" ? `${CANE(false)}<span class="e">🎅</span><span>${n.getDate() >= 24 && n.getMonth() === 11 ? "Frohe Weihnachten" : "Frohe Adventszeit"}</span><span class="e">🎅</span>${CANE(true)}`
      : s === "halloween" ? `<span class="e">🎃</span><span>Happy Halloween</span><span class="e">👻</span>`
      : s === "fasching" ? `<span class="e">🎭</span><span>Helau!</span><span class="e">🎉</span>`
      : s === "vday" ? `<span class="e">💘</span><span>Happy Valentinstag</span><span class="e">💘</span>`
      : s === "nye" ? `<span class="e">🎆</span><span>${n.getMonth() === 0 ? "Frohes neues Jahr" : "Guten Rutsch"}</span><span class="e">🥂</span>` : "";
    home.innerHTML = `
      ${s === "xmas" ? `<svg class="garland" viewBox="0 0 320 34" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 6 Q40 30 80 8 T160 8 T240 8 T320 6" fill="none" stroke="#2e5e3e" stroke-width="2"/>
        ${[20, 52, 84, 116, 148, 180, 212, 244, 276, 304].map((x, i) => `<circle class="bulb" cx="${x}" cy="${[16, 20, 9, 18, 14, 18, 9, 20, 16, 10][i]}" r="5" fill="${["#ff4d4d", "#ffd166", "#4dd2ff", "#7dffb0"][i % 4]}"/>`).join("")}
      </svg>` : ""}
      ${ribbon ? `<p class="ribbon">${ribbon}</p>` : ""}
      <header class="hello">
        <p class="eyebrow">Hallo Amelie</p>
        <h1>${greeting}</h1>
        <p class="together">♥ Zusammen seit ${tg.txt} <span>· ${tg.days} Tage</span></p>
        <p class="wx-home" id="wx-home" aria-live="polite"></p>
      </header>
      ${countdowns().map(c => `
        <section class="count" aria-labelledby="t-${c.id}">
          <div class="count-head">
            <span class="count-icon" aria-hidden="true">${c.icon}</span>
            <div><h2 id="t-${c.id}">${c.title}</h2><p class="sub">${c.sub}</p></div>
          </div>
          <div class="digits" id="d-${c.id}"></div>
          ${c.weather ? '<p class="weather" id="weather" aria-live="polite"></p>' : ""}
        </section>`).join("")}
      <div class="tiles">
        <button class="tile" id="tile-hunger"><span class="pic" aria-hidden="true">🍽️</span>
          <strong>Hunger?</strong><span class="sub">Sag mir, worauf du Lust hast</span></button>
        <button class="tile" id="tile-mood"><span class="pic" aria-hidden="true">${last ? last.split("|")[0] : "🌤️"}</span>
          <strong>Stimmungs&shy;barometer</strong><span class="sub">${last ? "Zuletzt: " + esc(last.split("|")[1]) : "Wie geht's dir gerade?"}</span></button>
        <button class="tile wide" id="tile-date"><span class="pic" aria-hidden="true">💡</span>
          <strong>Date-Idee</strong><span class="sub">Plan unser nächstes Date</span></button>
      </div>`;
    document.getElementById("tile-hunger").onclick = () => { step = 0; show("quiz"); renderQuiz(); };
    document.getElementById("tile-date").onclick = () => { show("date"); renderDate(); };
    document.getElementById("tile-mood").onclick = () => { mood = null; moodNote = ""; show("mood"); renderMood(); };
    homeKey = state(); paintWeather(); tick(); decorateSnow();
  }

  // Wechselt der Modus (z. B. um Mitternacht), wird die Übersicht neu aufgebaut.
  let homeKey = "";
  const state = () => season() + countdowns().map(c => c.id).join() + ymd(now());
  function tick() {
    if (state() !== homeKey) { applySeason(); greeting = pickGreeting(); renderHome(); checkPopup(); return; }
    const t = now().getTime();
    countdowns().forEach(c => {
      const el = document.getElementById("d-" + c.id); if (!el) return;
      let s = Math.floor((c.at - t) / 1000);
      if (s <= 0) { el.innerHTML = `<p class="done">${c.done || "Es ist so weit! 🎉"}</p>`; return; }
      const parts = [[Math.floor(s / 86400), "Tage"], [Math.floor(s % 86400 / 3600), "Std"], [Math.floor(s % 3600 / 60), "Min"], [s % 60, "Sek"]];
      el.innerHTML = parts.map(([n, l]) => `<div class="unit"><span class="num">${String(n).padStart(2, "0")}</span><span class="lbl">${l}</span></div>`).join("");
    });
  }
  setInterval(() => { if (!home.hidden) tick(); }, 1000);

  // ---------- Stimmungsbarometer ----------
  function renderMood() {
    card.innerHTML = `
      ${backHome}
      <h2>Wie geht es dir gerade?</h2>
      <div class="moods">${MOODS.map(([e, t], i) =>
        `<button class="opt mood${mood === i ? " picked" : ""}" data-i="${i}" id="mood-${i}"><span class="pic" aria-hidden="true">${e}</span><span>${t}</span></button>`).join("")}</div>
      <label class="field" for="mood-note">Magst du mir mehr erzählen? (freiwillig)
        <textarea id="mood-note" rows="3" placeholder="Was ist los?">${esc(moodNote)}</textarea></label>
      <div class="row"><span></span><button class="btn" id="mood-send" ${mood === null ? "disabled" : ""}>Stimmung senden</button></div>`;
    document.getElementById("home-btn").onclick = () => show("home");
    card.querySelectorAll(".mood").forEach(b => b.onclick = () => {
      mood = +b.dataset.i;
      card.querySelectorAll(".mood").forEach(o => o.classList.toggle("picked", o === b));
      document.getElementById("mood-send").disabled = false;
    });
    document.getElementById("mood-note").oninput = e => moodNote = e.target.value;
    document.getElementById("mood-send").onclick = sendMood;
  }

  async function sendMood() {
    const [e, t] = MOODS[mood];
    card.innerHTML = `<div class="big" aria-hidden="true">${e}</div><h2>Wird verschickt …</h2>`;
    const when = new Date().toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" });
    const ok = await sendMail(`Amelies Stimmung: ${e} ${t}`,
      `Amelie fühlt sich gerade: ${e} ${t}\nZeit: ${when}\n\nNachricht: ${moodNote.trim() || "keine"}`);
    if (ok) {
      store.set("lastMood", `${e}|${t}`);
      card.innerHTML = `<div class="big" aria-hidden="true">${e}</div><h2>Danke!</h2>
        <p class="lead">Jan weiß jetzt, wie es dir geht.</p>
        ${demo ? `<p class="note">Vorschau, hier wird nichts verschickt. Betreff der Mail: „Amelies Stimmung: ${e} ${t}“</p>` : ""}
        <div class="center"><button class="btn" id="home-btn">Zur Übersicht</button></div>`;
      document.getElementById("home-btn").onclick = () => show("home");
    } else failed(sendMood);
  }

  function failed(retry) {
    card.innerHTML = `<h2>Das hat nicht geklappt</h2>
      <p class="lead">Es konnte nichts verschickt werden. Prüf kurz deine Internetverbindung und versuch es nochmal.</p>
      <div class="center"><button class="btn" id="retry">Nochmal senden</button></div>`;
    document.getElementById("retry").onclick = retry;
  }

  // ---------- Hunger-Quiz ----------
  function hearts() {
    return '<div class="hearts" aria-hidden="true">' +
      QUESTIONS.map((_, i) => `<span class="${i <= step ? "on" : ""}">♥</span>`).join("") + "</div>";
  }

  function ranking() {
    const score = Object.fromEntries(Object.keys(DISHES).map(k => [k, 0]));
    QUESTIONS.forEach((item, i) => item.kind || answers[i].forEach(j => {
      for (const [k, p] of Object.entries(item.a[j][2])) score[k] += p;
    }));
    return Object.keys(DISHES).filter(k => score[k] > -50)
      .sort((x, y) => score[y] - score[x]).map(k => ({ name: DISHES[k][0], img: DISHES[k][1], score: score[k] }));
  }

  function renderQuiz() {
    fade(card);
    const item = QUESTIONS[step], last = step === QUESTIONS.length - 1;
    const ready = () => item.multi || item.kind === "text" || answers[step].length > 0 || notes[step].trim() !== "";
    const field = (label, ph) => `<label class="field" for="note-${step}">${label}
        <textarea id="note-${step}" rows="${item.kind === "text" ? 4 : 2}" placeholder="${ph}">${esc(notes[step])}</textarea></label>`;
    card.innerHTML = hearts() + `
      <p class="eyebrow">Frage ${step + 1} von ${QUESTIONS.length}</p>
      ${item.img ? `<div class="big" aria-hidden="true">${item.img}</div>` : ""}
      <h2>${item.q}</h2>
      ${item.hint ? `<p class="lead">${item.hint}</p>` : ""}
      ${item.a ? `<div class="options">${item.a.map(([t, img], i) =>
        `<button class="opt${answers[step].includes(i) ? " picked" : ""}" data-i="${i}" id="opt-${step}-${i}">
          <span class="pic" aria-hidden="true">${img}</span><span>${t}</span></button>`).join("")}</div>` : ""}
      ${item.note ? field(item.note, item.placeholder) : ""}
      ${item.kind === "text" ? field("", item.placeholder) : ""}
      <div class="row">
        <button class="link" id="back">${step > 0 ? "← Zurück" : "← Übersicht"}</button>
        <button class="btn" id="next" ${ready() ? "" : "disabled"}>${last ? "Abschicken" : "Weiter"}</button>
      </div>`;
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (item.multi) {
        answers[step] = answers[step].includes(i) ? answers[step].filter(x => x !== i) : [...answers[step], i];
        b.classList.toggle("picked");
      } else {
        answers[step] = [i];
        card.querySelectorAll(".opt").forEach(o => o.classList.toggle("picked", o === b));
      }
      document.getElementById("next").disabled = !ready();
    });
    const ta = card.querySelector("textarea");
    if (ta) ta.oninput = () => { notes[step] = ta.value; document.getElementById("next").disabled = !ready(); };
    document.getElementById("back").onclick = () => { if (step > 0) { step--; renderQuiz(); } else show("home"); };
    document.getElementById("next").onclick = () => { last ? sendQuiz() : (step++, renderQuiz()); };
  }

  async function sendQuiz() {
    card.innerHTML = `<div class="big" aria-hidden="true">💌</div><h2>Wird verschickt …</h2>`;
    // Top 3 plus alle, die punktgleich mit Platz 3 sind. Gleiche Punkte = gleicher Platz.
    const all = ranking(), cut = all.length > 3 ? all[2].score : -Infinity;
    const top = all.filter(d => d.score >= cut).map(d => ({ ...d, place: all.findIndex(x => x.score === d.score) + 1 }));
    const di = QUESTIONS.findIndex(x => x.kind === "dessert"), ti = QUESTIONS.findIndex(x => x.kind === "text");
    const dessert = [answers[di].map(j => QUESTIONS[di].a[j][0]).join(", "), notes[di].trim() && `Wunsch: ${notes[di].trim()}`]
      .filter(Boolean).join(" · ") || "keine Angabe";
    const text = "Amelies Favoriten:\n" + top.map(d => `${d.place}. ${d.img} ${d.name} (${d.score} Punkte)`).join("\n") +
      `\n\nNachtisch: ${dessert}` +
      `\n\nBesonderer Wunsch: ${notes[ti].trim() || "keiner"}` +
      "\n\nIhre Antworten:\n\n" + QUESTIONS.filter(x => !x.kind).map(x => {
        const i = QUESTIONS.indexOf(x);
        return `${x.q}\n→ ${answers[i].map(j => x.a[j][0]).join(", ") || "nichts ausgewählt"}`;
      }).join("\n\n");
    const ok = await sendMail("Amelies Favoriten: " + top.map(d => d.name).join(", "), text);
    if (ok) {
      card.innerHTML = `<div class="big" aria-hidden="true">♥</div><h1>Danke, Amelie!</h1>
        <p class="lead">Jan weiß jetzt, worauf du Hunger hast. Lass dich überraschen.</p>` +
        (demo ? `<p class="note">Vorschau, hier wird nichts verschickt. In der Mail an Jan stünde:<br><strong>${top.map(d => `${d.place}. ${d.img} ${d.name}`).join(" · ")}</strong><br>Nachtisch: ${esc(dessert)}</p>` : "") +
        `<div class="center"><button class="btn" id="home-btn">Zur Übersicht</button></div>`;
      answers.forEach(a => a.length = 0); notes.fill("");
      document.getElementById("home-btn").onclick = () => show("home");
    } else failed(sendQuiz);
  }

  applySeason(); greeting = pickGreeting();
  if (demo) {   // Vorschau-Leiste zum Ausprobieren der Modi
    const bar = document.getElementById("sim");
    bar.hidden = false;
    bar.innerHTML = `<p class="section-label">Vorschau: Zeitpunkt simulieren</p><div class="chips">${Object.keys(SIMULATE).map(k =>
      `<button type="button" class="chip${k === simName ? " picked" : ""}" data-k="${k}">${k}</button>`).join("")}</div>`;
    bar.onclick = e => {
      const k = e.target.dataset && e.target.dataset.k; if (!k) return;
      popupChecked = true; forceSnow = /Schnee/.test(k) ? true : null; simName = k; offset = SIMULATE[k] ? new Date(SIMULATE[k]) - Date.now() : 0;
      bar.querySelectorAll(".chip").forEach(c => c.classList.toggle("picked", c.dataset.k === k));
      applySeason(); greeting = pickGreeting(); show("home"); checkPopup();
    };
  }
  const unlockedAt = +store.get("unlocked") || 0;
  if (Date.now() - unlockedAt < UNLOCK_HOURS * 36e5) show("home"); else { show("gate"); renderGate(); }
</script>

</body>
