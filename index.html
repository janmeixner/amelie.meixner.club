<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragen für Amelie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
  /* Layout: eine Karte in der Mitte, eine Frage pro Schritt, Fortschritt als Herzreihe */
  :root {
    --bg: #fbf1ee; --card: #fffaf8; --fg: #3a1f24; --muted: #8a6a6f;
    --accent: #b8325a; --accent-soft: #f6d9e0; --line: #ecd6d6;
    --display: "Young Serif", Georgia, serif;
    --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1d1216; --card: #2a1a20; --fg: #f6e8eb; --muted: #c4a3ab;
    --accent: #ff7aa0; --accent-soft: #4a2531; --line: #3d2830; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #1d1216; --card: #2a1a20; --fg: #f6e8eb; --muted: #c4a3ab;
    --accent: #ff7aa0; --accent-soft: #4a2531; --line: #3d2830; color-scheme: dark }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body);
    display: grid; place-items: center; padding: 24px 16px; font-size: 16px; }
  main { width: 100%; max-width: 32rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 32px 24px; box-shadow: 0 12px 40px -24px rgba(120,30,60,.35); }
  .hearts { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .hearts span { font-size: 15px; color: var(--line); transition: color .3s, transform .3s; }
  .hearts span.on { color: var(--accent); transform: scale(1.15); }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    text-align: center; margin: 0 0 8px; font-weight: 700; }
  h1, h2 { font-family: var(--display); font-weight: 400; text-align: center; text-wrap: balance; margin: 0 0 24px; }
  h1 { font-size: clamp(1.9rem, 7vw, 2.5rem); line-height: 1.15; }
  h2 { font-size: clamp(1.4rem, 5vw, 1.75rem); line-height: 1.25; }
  p.lead { text-align: center; color: var(--muted); line-height: 1.6; margin: -8px 0 28px; }
  .options { display: grid; gap: 10px; }
  .opt { font: inherit; text-align: left; padding: 14px 18px; border-radius: 14px; cursor: pointer;
    border: 1.5px solid var(--line); background: transparent; color: var(--fg);
    transition: border-color .2s, background .2s, transform .15s; }
  .opt:hover { border-color: var(--accent); }
  .opt:active { transform: scale(.98); }
  .opt.picked { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
  .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 24px; }
  .btn { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 24px; cursor: pointer;
    background: var(--accent); color: var(--card); }
  .btn:disabled { opacity: .4; cursor: default; }
  .link { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px 0; }
  .center { display: flex; justify-content: center; margin-top: 8px; }
  .big { font-size: 48px; text-align: center; margin-bottom: 12px; color: var(--accent); }
  .note { font-size: 13px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.5; }
  .fade { animation: fade .35s ease both; }
  @keyframes fade { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } .opt, .hearts span { transition: none; } }
</style>
</head>
<body>

<main>
  <div class="card" id="card"></div>
</main>

<script>
  // Mail-Versand über Web3Forms. Den Schlüssel bekommst du kostenlos auf web3forms.com.
  const ACCESS_KEY = "90dcfece-f54e-4203-861b-e7a430412afc";

  // Die Gerichte, aus denen am Ende die Top 3 ermittelt werden.
  const DISHES = {
    pizza: "Pizza", pasta: "Pasta", sushi: "Sushi", burger: "Burger", thai: "Thai-Curry",
    indisch: "Indisch", mex: "Mexikanisch", griech: "Griechisch", steak: "Steak", bowl: "Bowl oder Salat"
  };

  // Jede Antwort gibt den genannten Gerichten Punkte. multi: mehrere Antworten möglich.
  const QUESTIONS = [
    { q: "Worauf hast du gerade am meisten Lust?", a: [
      ["Etwas Deftiges", { burger: 2, steak: 2, griech: 1, pizza: 1 }],
      ["Etwas Leichtes und Frisches", { sushi: 2, bowl: 2, griech: 1 }],
      ["Etwas Würziges", { indisch: 2, thai: 2, mex: 2 }],
      ["Etwas Gemütliches", { pasta: 2, pizza: 2 }] ] },
    { q: "Wie scharf darf es sein?", a: [
      ["Gar nicht", { pasta: 1, pizza: 1, sushi: 1, burger: 1, steak: 1, indisch: -1, thai: -1, mex: -1 }],
      ["Ein bisschen", { mex: 1, griech: 1, thai: 1 }],
      ["Richtig scharf", { indisch: 2, thai: 2, mex: 2 }] ] },
    { q: "Fleisch, Fisch oder vegetarisch?", a: [
      ["Fleisch", { steak: 2, burger: 2, griech: 1, mex: 1 }],
      ["Fisch", { sushi: 3 }],
      ["Vegetarisch", { pasta: 1, pizza: 1, bowl: 2, indisch: 1, steak: -3 }],
      ["Ist mir egal", {}] ] },
    { q: "Wo möchtest du am liebsten essen?", a: [
      ["Schick ausgehen", { steak: 2, sushi: 1, pasta: 1 }],
      ["Gemütlich im Restaurant", { griech: 2, indisch: 1, thai: 1, mex: 1 }],
      ["Auf der Couch bestellen", { pizza: 2, burger: 1, sushi: 1 }],
      ["Zusammen selbst kochen", { pasta: 2, bowl: 1, mex: 1 }] ] },
    { q: "Welche Beilage gewinnt?", a: [
      ["Pommes", { burger: 2, steak: 1 }],
      ["Reis", { thai: 2, indisch: 1, sushi: 1 }],
      ["Brot", { griech: 2, indisch: 1, pizza: 1 }],
      ["Nudeln", { pasta: 3 }] ] },
    { q: "Wie groß ist dein Hunger?", a: [
      ["Nur ein kleiner Hunger", { sushi: 1, bowl: 2 }],
      ["Normaler Hunger", { pasta: 1, thai: 1, griech: 1 }],
      ["Riesenhunger", { burger: 2, steak: 1, pizza: 1, mex: 1 }] ] },
    { q: "In welchem Land würdest du heute gern essen?", a: [
      ["Italien", { pizza: 2, pasta: 2 }],
      ["Japan oder Thailand", { sushi: 2, thai: 2 }],
      ["Griechenland", { griech: 3 }],
      ["Mexiko", { mex: 3 }],
      ["Indien", { indisch: 3 }],
      ["USA", { burger: 2, steak: 2 }] ] },
    { q: "Gibt es etwas, das du heute auf keinen Fall willst?", multi: true,
      a: Object.entries(DISHES).map(([k, name]) => [name, { [k]: -100 }]) }
  ];

  const card = document.getElementById("card");
  const answers = QUESTIONS.map(() => []);   // gewählte Antwort-Indizes je Frage
  let step = -1;

  function hearts() {
    return '<div class="hearts" aria-hidden="true">' +
      QUESTIONS.map((_, i) => `<span class="${i <= step ? "on" : ""}">♥</span>`).join("") + "</div>";
  }

  function ranking() {
    const score = Object.fromEntries(Object.keys(DISHES).map(k => [k, 0]));
    QUESTIONS.forEach((item, i) => answers[i].forEach(j => {
      for (const [k, p] of Object.entries(item.a[j][1])) score[k] += p;
    }));
    return Object.keys(DISHES).filter(k => score[k] > -50)
      .sort((x, y) => score[y] - score[x]).map(k => ({ name: DISHES[k], score: score[k] }));
  }

  function render() {
    card.classList.remove("fade"); void card.offsetWidth; card.classList.add("fade");
    if (step === -1) {
      card.innerHTML = `
        <div class="big" aria-hidden="true">♥</div>
        <h1>Hallo Amelie</h1>
        <p class="lead">Was wollen wir essen? Beantworte mir ${QUESTIONS.length} kurze Fragen, dann weiß ich Bescheid.</p>
        <div class="center"><button class="btn" id="start">Los geht's</button></div>`;
      document.getElementById("start").onclick = () => { step = 0; render(); };
      return;
    }
    const item = QUESTIONS[step], last = step === QUESTIONS.length - 1;
    const ready = () => item.multi || answers[step].length > 0;
    card.innerHTML = hearts() + `
      <p class="eyebrow">Frage ${step + 1} von ${QUESTIONS.length}</p>
      <h2>${item.q}</h2>
      ${item.multi ? '<p class="lead">Tipp alles an, was heute nicht geht. Wenn alles okay ist, einfach weiter.</p>' : ""}
      <div class="options">${item.a.map(([t], i) =>
        `<button class="opt${answers[step].includes(i) ? " picked" : ""}" data-i="${i}" id="opt-${step}-${i}">${t}</button>`).join("")}</div>
      <div class="row">
        <button class="link" id="back">${step > 0 ? "← Zurück" : ""}</button>
        <button class="btn" id="next" ${ready() ? "" : "disabled"}>${last ? "Abschicken" : "Weiter"}</button>
      </div>`;
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (item.multi) {
        answers[step] = answers[step].includes(i) ? answers[step].filter(x => x !== i) : [...answers[step], i];
        b.classList.toggle("picked");
      } else {
        answers[step] = [i];
        card.querySelectorAll(".opt").forEach(o => o.classList.toggle("picked", o === b));
      }
      document.getElementById("next").disabled = !ready();
    });
    document.getElementById("back").onclick = () => { if (step > 0) { step--; render(); } };
    document.getElementById("next").onclick = () => { last ? send() : (step++, render()); };
  }

  async function send() {
    card.innerHTML = `<div class="big" aria-hidden="true">♥</div><h2>Wird verschickt …</h2>`;
    const top = ranking().slice(0, 3);
    const text = "Amelies Top 3:\n" + top.map((d, i) => `${i + 1}. ${d.name} (${d.score} Punkte)`).join("\n") +
      "\n\nIhre Antworten:\n\n" + QUESTIONS.map((x, i) =>
        `${x.q}\n→ ${answers[i].map(j => x.a[j][0]).join(", ") || "nichts ausgewählt"}`).join("\n\n");
    let ok = false, demo = ACCESS_KEY === "DEIN_ACCESS_KEY";
    if (!demo) {
      try {
        const r = await fetch("https://api.web3forms.com/submit", {
          method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ access_key: ACCESS_KEY, subject: "Amelies Top 3: " + top.map(d => d.name).join(", "),
            from_name: "amelie.meixner.club", message: text })
        });
        ok = (await r.json()).success;
      } catch (e) { ok = false; }
    }
    if (ok || demo) {
      card.innerHTML = `<div class="big" aria-hidden="true">♥</div><h1>Danke, Amelie!</h1>
        <p class="lead">Jan weiß jetzt, worauf du Hunger hast. Lass dich überraschen.</p>` +
        (demo ? `<p class="note">Vorschau, hier wird nichts verschickt. In der Mail an Jan stünde:<br><strong>${top.map((d, i) => `${i + 1}. ${d.name}`).join(" · ")}</strong></p>` : "");
    } else {
      card.innerHTML = `<h2>Das hat nicht geklappt</h2>
        <p class="lead">Die Antworten konnten nicht verschickt werden. Prüf kurz deine Internetverbindung und versuch es nochmal.</p>
        <div class="center"><button class="btn" id="retry">Nochmal senden</button></div>`;
      document.getElementById("retry").onclick = send;
    }
  }

  render();
</script>
</body>
</html>
